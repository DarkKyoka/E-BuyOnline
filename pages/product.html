<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View product information at E-Buy Online."
    />
    <title>Product | E-Buy Online!</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/product.css" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"
    ></script>
    <script
      type="module"
      src="../scripts/dark and light mode/darkAndLight.js"
    ></script>
    <script type="module" src="../scripts/productDetails.js"></script>
  </head>
  <body>
    <main class="site product-page" id="site">
      <header class="navbar shared-navbar">
        <div class="brand-logo" aria-hidden="true"></div>
        <div class="brand-group">
          <a class="brand" href="index.html#home">E-Buy Online!</a>
          <nav aria-label="Main navigation">
            <a href="index.html#home">Home</a>
            <a class="nav-link" href="index.html#categories">
              Products <i data-lucide="arrow-up-right" aria-hidden="true"></i>
            </a>
            <a href="index.html#about">About</a>
          </nav>
        </div>

        <div class="nav-actions">
          <div class="favorites-wrap">
            <button
              class="icon-button favorites-button"
              id="favorites-button"
              type="button"
              aria-expanded="false"
              aria-controls="favorites-popover"
            >
              <i data-lucide="heart" aria-hidden="true"></i>
              <span id="favorites-count">0</span>
              <span class="sr-only">Open favorites</span>
            </button>
            <aside
              class="favorites-popover"
              id="favorites-popover"
              aria-label="Favorite products"
              hidden
            >
              <h2>Your favorites</h2>
              <div id="favorites-list"></div>
            </aside>
          </div>

          <div class="cart-wrap">
            <button
              class="icon-button cart-button"
              id="cart-button"
              type="button"
              aria-expanded="false"
              aria-controls="cart-popover"
            >
              <i data-lucide="shopping-basket" aria-hidden="true"></i>
              <span id="cart-count">0</span>
              <span class="sr-only">Open cart</span>
            </button>
            <aside
              class="cart-popover"
              id="cart-popover"
              aria-label="Cart preview"
              hidden
            >
              <div class="mini-cart-list" id="mini-cart-list"></div>
              <p class="mini-total">Total: <span id="mini-total">0</span>$</p>
              <a class="header-shop-link" href="index.html#products"
                >Continue shopping</a
              >
            </aside>
          </div>

          <button
            class="icon-button"
            id="theme-button"
            type="button"
            aria-label="Use dark mode"
          >
            <i data-lucide="moon" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <div class="product-page-content">
        <article class="product-detail" id="product-detail">
          <div class="detail-visual" aria-hidden="true">
            <span id="product-icon"></span>
          </div>

          <div class="detail-content">
            <a
              class="category-link"
              id="product-category"
              href="index.html#products"
            ></a>
            <h1 id="product-name"></h1>
            <p class="product-author" id="product-author" hidden></p>
            <p class="product-description" id="product-description"></p>

            <dl class="product-facts">
              <div>
                <dt>Price</dt>
                <dd id="product-price"></dd>
              </div>
              <div>
                <dt>Added</dt>
                <dd><time id="product-date"></time></dd>
              </div>
            </dl>

            <div class="detail-actions">
              <button
                class="detail-cart-button"
                id="detail-add-cart"
                type="button"
              >
                Add to cart
              </button>
              <button
                class="detail-favorite-button"
                id="detail-toggle-favorite"
                type="button"
                aria-pressed="false"
              >
                <span aria-hidden="true" hidden></span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"
                  />
                </svg>
                <span id="favorite-label">Add to favorites</span>
              </button>
            </div>
          </div>
        </article>

        <section class="product-not-found" id="product-not-found" hidden>
          <p class="not-found-code">404</p>
          <h1>Product not found</h1>
          <p>The product may have been removed or the link is incorrect.</p>
          <a href="index.html#products">Browse all products</a>
        </section>
      </div>
    </main>
  </body>
</html>
